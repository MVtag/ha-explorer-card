name: Prepare beta34 weather simulator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-beta34.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch card source for beta34
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ha-explorer-card.ts")
          source = path.read_text()

          old_version = 'const CARD_VERSION="0.40.0-beta.33";'
          new_version = 'const CARD_VERSION="0.40.0-beta.34";'
          if old_version not in source and new_version not in source:
              raise SystemExit("Expected beta.33 CARD_VERSION was not found")
          source = source.replace(old_version, new_version, 1)

          old_weather = 'private weatherState():string{const weather=this.config?.appearance?.weather;if(!weather?.enabled)return"clear";const entity=weather.entity?.trim();if(!entity)return"clear";return this.hass?.states[entity]?.state?.trim().toLowerCase()||"clear";}'
          new_weather = 'private weatherState():string{const weather=this.config?.appearance?.weather;if(!weather?.enabled)return"clear";const previewState=weather.preview_state?.trim().toLowerCase();if(this.preview&&previewState&&previewState!=="live")return previewState;const entity=weather.entity?.trim();if(!entity)return"clear";return this.hass?.states[entity]?.state?.trim().toLowerCase()||"clear";}'
          if old_weather in source:
              source = source.replace(old_weather, new_weather, 1)
          elif new_weather not in source:
              raise SystemExit("Expected weatherState implementation was not found")

          path.write_text(source)
          PY

      - name: Commit beta34 source patch
        run: |
          if git diff --quiet -- src/ha-explorer-card.ts; then
            echo "beta34 source patch is already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ha-explorer-card.ts
          git commit -m "Prepare v0.40.0-beta.34 weather simulator"
          git push
