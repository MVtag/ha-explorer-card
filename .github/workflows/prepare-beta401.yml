name: Prepare beta401 prerelease track

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-beta401.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bump Explorer card version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/ha-explorer-card.ts")
          text = path.read_text()
          old = 'const CARD_VERSION="0.40.0-beta.34";'
          new = 'const CARD_VERSION="0.40.1-beta.1";'
          if old not in text:
              raise SystemExit("Expected beta.34 version marker not found")
          path.write_text(text.replace(old, new, 1))
          PY
          grep -F 'const CARD_VERSION="0.40.1-beta.1";' src/ha-explorer-card.ts
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ha-explorer-card.ts
          git commit -m "Prepare v0.40.1-beta.1 HACS prerelease track"
          git push
